name: PR Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

  quick-test:
    name: Quick Build & Test (Linux x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install build pytest auditwheel

      - name: Install package in editable mode
        run: pip install -e .

      - name: Run unit tests
        run: pytest tests/test_import.py tests/test_config.py tests/test_port_finder.py -v

      - name: Build wheel
        run: python -m build --wheel
        timeout-minutes: 10

      - name: Test wheel in clean environment
        run: |
          # Create fresh virtualenv
          python -m venv test-env
          source test-env/bin/activate

          # Install wheel
          pip install dist/*.whl

          # Run integration test
          python test_wheel.py

          # Cleanup
          deactivate

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-test-wheel
          path: dist/*.whl
          retention-days: 7

  manylinux-wheel:
    name: manylinux_2_28 Build & Rocky Linux 8 Test (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build wheel in manylinux_2_28 container
        # Fails if valkey-server needs anything newer than glibc 2.28.
        run: |
          docker run --rm -v "$PWD:/io" quay.io/pypa/manylinux_2_28_x86_64 \
            /io/scripts/build_manylinux_wheel.sh
        timeout-minutes: 20

      - name: Test wheel on oldest supported glibc
        run: |
          docker run --rm -v "$PWD:/io" rockylinux:8 bash -euc '
            dnf install -y -q python3.12
            python3.12 -m venv /tmp/venv
            /tmp/venv/bin/pip install /io/dist/*.whl
            cd /tmp && /tmp/venv/bin/python /io/test_wheel.py
          '
